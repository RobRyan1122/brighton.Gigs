name: Run Brighton Gigs Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 0'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      actions: write

    env:
      SENDER_EMAIL: ${{ vars.SENDER_EMAIL }}
      RECIPIENT_EMAIL: ${{ vars.RECIPIENT_EMAIL }}
      SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # Refresh the schedule before scraping, even if a venue later fails.
      - name: Keep weekly schedule active
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method PUT "repos/$GH_REPO/actions/workflows/run_pipeline.yml/enable"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests

      - name: Run pipeline
        run: python Venues/Orchastrators/main.py

      - name: Email failure alert
        if: failure()
        run: python Venues/Orchastrators/alert_failure.py

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brighton-gigs-output
          path: |
            scraper_health.md
            output_daily
            Venues/csvs
          if-no-files-found: warn
